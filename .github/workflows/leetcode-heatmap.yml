name: Update LeetCode Heatmap

on:
  schedule:
    # Run daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate LeetCode Heatmap
        env:
          LEETCODE_USERNAME: ananyakarn_kripinya
          OUTPUT_PATH: assets/leetcode-heatmap.svg
        run: python scripts/generate_leetcode_heatmap.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-heatmap.svg
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update leetcode heatmap [skip ci]"
          git push
